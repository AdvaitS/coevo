[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coevo"
version = "0.2.0"
description = "Surrogate-assisted and coevolutionary evolutionary computation for expensive black-box problems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Advait Shukla" }]
keywords = [
  "evolutionary-algorithms",
  "surrogate-assisted",
  "coevolution",
  "differential-evolution",
  "genetic-algorithm",
  "particle-swarm",
  "optimization",
  "neuroevolution",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.20",
  "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "scikit-learn>=1.0",
]
sklearn = [
  "scikit-learn>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coevo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
